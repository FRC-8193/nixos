# Variables used by keybinds.conf. This file is prepended to keybinds.conf at install time.
$qsConfig = ii
$terminal = kitty
$fileManager = thunar
$codeEditor = kitty -e nvim
$textEditor = kitty -e nvim
$officeSoftware = libreoffice
$volumeMixer = pavucontrol
$settingsApp = qs -p ~/.config/quickshell/ii/settings.qml
$taskManager = kitty -e btop
